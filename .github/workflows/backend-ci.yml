name: backend-ci

on:
  push:
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"

permissions:
  contents: read

defaults:
  run:
    working-directory: backend

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: talkitout
          POSTGRES_PASSWORD: talkitout
          POSTGRES_DB: talkitout
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U talkitout -d talkitout"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgres://talkitout:talkitout@localhost:5433/talkitout
      TEST_DATABASE_URL: postgres://talkitout:talkitout@localhost:5433/talkitout_test
      # CI-only value, not a production secret; must pass the >=32 char check.
      JWT_SECRET: ci-only-jwt-secret-0123456789abcdef0123456789abcdef
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      # docker/init.sql creates the test database only under docker-compose;
      # the service container starts with just POSTGRES_DB, so create it here.
      - name: Create the test database
        run: |
          PG_CID="$(docker ps --filter 'ancestor=postgres:16' --format '{{.ID}}' | head -1)"
          docker exec "$PG_CID" psql -U talkitout -d talkitout -c 'CREATE DATABASE talkitout_test;'
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm run migrate
      - run: npm test
      # Blocking since Run 078 (zod 4 upgrade cleared GHSA-mrhx-c7xc-m3w5).
      - name: npm audit (runtime dependencies only)
        run: npm audit --omit=dev --audit-level=high
      # End to end: the real server plus the 13-step moderation demo
      # (register, group, anonymous submit, stub rewrite, accept, chat,
      # notifications, reject, announcement, feed, post-to-group).
      - name: End-to-end demo flow against a running server
        env:
          RUN_STUB_WORKER: "true"
          PIPELINE_MODE: stub
          RUN_FEED_WORKER: "true"
          FEED_PROVIDER: fake
          PORT: "3000"
        run: |
          set -euo pipefail
          node dist/server.js > server.log 2>&1 &
          SERVER_PID=$!
          for i in $(seq 1 30); do
            curl -sf http://localhost:3000/ready >/dev/null && break
            sleep 1
          done
          curl -sf http://localhost:3000/ready
          bash scripts/demo-flow.sh > demo.log 2>&1 || { cat demo.log; cat server.log; exit 1; }
          grep -q '"display_sender":null' demo.log
          grep -q '"status":"accepted"' demo.log
          grep -q '^done\.$' demo.log
          kill $SERVER_PID

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Build the image (no push)
        run: docker build -t talkitout-backend:ci .
        working-directory: backend
      - name: Smoke test against a throwaway Postgres
        working-directory: backend
        run: |
          set -euo pipefail
          docker network create ci-net
          docker run -d --name ci-pg --network ci-net \
            -e POSTGRES_USER=talkitout -e POSTGRES_PASSWORD=talkitout -e POSTGRES_DB=talkitout \
            postgres:16
          for i in $(seq 1 30); do
            docker exec ci-pg pg_isready -U talkitout -d talkitout >/dev/null 2>&1 && break
            sleep 1
          done
          # Migrations run explicitly, never automatically on container start.
          docker run --rm --network ci-net \
            -e DATABASE_URL=postgres://talkitout:talkitout@ci-pg:5432/talkitout \
            -e JWT_SECRET=ci-only-jwt-secret-0123456789abcdef0123456789abcdef \
            talkitout-backend:ci node dist/migrate-cli.js
          docker run -d --name ci-api --network ci-net -p 3000:3000 \
            -e DATABASE_URL=postgres://talkitout:talkitout@ci-pg:5432/talkitout \
            -e JWT_SECRET=ci-only-jwt-secret-0123456789abcdef0123456789abcdef \
            talkitout-backend:ci
          for i in $(seq 1 30); do
            curl -fsS http://localhost:3000/health >/dev/null 2>&1 && break
            sleep 1
          done
          echo "health: $(curl -fsS http://localhost:3000/health)"
          echo "ready:  $(curl -fsS http://localhost:3000/ready)"
          docker rm -f ci-api ci-pg
          docker network rm ci-net
