# The whole Talk It Out stack with one command:
#
#   cp .env.stack.example .env      # then set real secrets in .env
#   docker compose up -d --build
#
#   web  http://localhost:8080   (Flutter app)
#   api  http://localhost:3000   (backend; the app calls it from the browser)
#
# Migrations run once, explicitly, in the "migrate" service before the API
# starts (the API image never migrates on its own). The rewrite pipeline
# runs as the in-process stub unless PIPELINE_MODE=external and a worker
# is running (see pipeline/README.md). For a public deployment put both
# ports behind a TLS reverse proxy and set the URLs in .env accordingly.
services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: talkitout
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: talkitout
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U talkitout -d talkitout"]
      interval: 2s
      timeout: 5s
      retries: 30

  migrate:
    build: ./backend
    image: talkitout-backend
    command: ["node", "dist/migrate-cli.js"]
    environment: &api-env
      NODE_ENV: production
      DATABASE_URL: postgres://talkitout:${POSTGRES_PASSWORD}@db:5432/talkitout
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env (64 random hex chars)}
      PIPELINE_API_KEY: ${PIPELINE_API_KEY:-}
      PIPELINE_MODE: ${PIPELINE_MODE:-stub}
      RUN_STUB_WORKER: ${RUN_STUB_WORKER:-true}
      RUN_FEED_WORKER: "true"
      FEED_PROVIDER: fake
      CORS_ORIGINS: ${WEB_ORIGIN:-http://localhost:8080}
      MAIL_TRANSPORT: ${MAIL_TRANSPORT:-disabled}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-465}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_URL: ${SMTP_URL:-}
      MAIL_FROM: ${MAIL_FROM:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      TRUST_PROXY: ${TRUST_PROXY:-}
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  api:
    image: talkitout-backend
    restart: unless-stopped
    environment:
      <<: *api-env
      PORT: "3000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports:
      - "${API_PORT:-3000}:3000"

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
      args:
        API_BASE_URL: ${API_PUBLIC_URL:-http://localhost:3000}
        GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "${WEB_PORT:-8080}:8080"

volumes:
  pgdata:
