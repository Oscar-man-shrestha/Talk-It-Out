name: stack-ci

# Boots the full docker-compose stack (db, migrate, api, web) exactly as a
# deployer would, then checks it end to end.
on:
  push:
    paths:
      - "docker-compose.yml"
      - "Dockerfile.web"
      - ".dockerignore"
      - "docker/**"
      - "backend/Dockerfile"
      - "backend/src/**"
      - "backend/migrations/**"
      - "backend/package*.json"
      - "lib/**"
      - "web/**"
      - "pubspec.*"
      - ".github/workflows/stack-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compose:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: CI-only settings (random, never reused)
        run: |
          {
            echo "POSTGRES_PASSWORD=$(openssl rand -hex 16)"
            echo "JWT_SECRET=$(openssl rand -hex 32)"
          } > .env
      - name: Build and start the stack
        run: docker compose up -d --build
      - name: Wait for the API and the web app
        run: |
          for i in $(seq 1 90); do
            curl -sf http://localhost:3000/ready >/dev/null && \
            curl -sf http://localhost:8080/ >/dev/null && break
            sleep 2
          done
          echo "api:  $(curl -sf http://localhost:3000/ready)"
          curl -sf http://localhost:8080/ | grep -q flutter_bootstrap.js
          curl -sf http://localhost:8080/flutter_bootstrap.js >/dev/null
          curl -sI http://localhost:8080/index.html | grep -qi '^cache-control: no-cache'
          echo "web:  ok"
      - name: The migrate service ran and exited cleanly
        run: |
          test "$(docker compose ps -a migrate --format '{{.ExitCode}}')" = "0"
      - name: Browser CORS from the web origin is allowed
        run: |
          curl -s -o /dev/null -D - -X OPTIONS http://localhost:3000/auth/login \
            -H 'Origin: http://localhost:8080' \
            -H 'Access-Control-Request-Method: POST' \
            | grep -qi '^access-control-allow-origin: http://localhost:8080'
      - name: End-to-end moderation flow against the stack
        working-directory: backend
        run: |
          set -euo pipefail
          BASE=http://localhost:3000 bash scripts/demo-flow.sh > demo.log 2>&1 || { cat demo.log; exit 1; }
          grep -q '"display_sender":null' demo.log
          grep -q '"status":"accepted"' demo.log
          grep -q '^done\.$' demo.log
      - name: Logs on failure
        if: failure()
        run: docker compose logs --no-color --tail=200
      - name: Tear down
        if: always()
        run: docker compose down -v
