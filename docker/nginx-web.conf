# Static server for the Flutter web build (hash routing, so every path is
# a file). Long-lived caching for hashed assets; never cache the entry
# files, so a new deploy is picked up immediately.
server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  server_tokens off;

  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  # Allow Google's sign-in popup to talk back to the page.
  add_header Cross-Origin-Opener-Policy same-origin-allow-popups always;

  location = /index.html          { add_header Cache-Control "no-cache"; }
  location = /flutter_bootstrap.js { add_header Cache-Control "no-cache"; }
  location = /flutter_service_worker.js { add_header Cache-Control "no-cache"; }
  location = /version.json        { add_header Cache-Control "no-cache"; }

  location / {
    try_files $uri $uri/ /index.html;
  }

  gzip on;
  gzip_types application/javascript application/json text/css image/svg+xml application/wasm;
}
