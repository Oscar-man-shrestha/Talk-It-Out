# Builds the Flutter web app and publishes it to GitHub Pages (free for
# public repositories). Run it from the Actions tab after setting the
# repository variable API_BASE_URL (Settings -> Secrets and variables ->
# Actions -> Variables). Guide: docs/DEPLOY.md
name: deploy-web

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.4
          channel: stable
          cache: true
      - name: Check the API address is set
        run: |
          if [ -z "${{ vars.API_BASE_URL }}" ]; then
            echo "Set the repository variable API_BASE_URL first (see docs/DEPLOY.md)." >&2
            exit 1
          fi
      - run: flutter pub get
      - name: Build
        run: |
          flutter build web --release \
            --base-href "/${{ github.event.repository.name }}/" \
            --dart-define=USE_MOCK=false \
            --dart-define=API_BASE_URL="${{ vars.API_BASE_URL }}" \
            --dart-define=APP_WEB_URL="https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}" \
            --dart-define=GOOGLE_CLIENT_ID="${{ vars.GOOGLE_CLIENT_ID }}"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
