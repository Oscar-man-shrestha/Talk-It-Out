# Example production stack — a starting point, not a turnkey deployment.
#
# Secrets live in an env file that is NEVER committed (add it to .gitignore):
#   backend.prod.env:
#     POSTGRES_PASSWORD=<strong password>
#     JWT_SECRET=<64+ random hex chars>
#     # optional, enables the internal pipeline API for the Python worker:
#     PIPELINE_API_KEY=<64+ random hex chars or unset>
#
# The API container speaks plain HTTP. Put the published port behind a
# TLS-terminating reverse proxy (nginx, Caddy, an ALB, ...) and set
# TRUST_PROXY to the proxy hop count so rate limits see client IPs.
#
# First run: apply migrations explicitly (never automatic on start):
#   docker compose -f docker-compose.prod.example.yml up -d db
#   docker compose -f docker-compose.prod.example.yml run --rm api node dist/migrate-cli.js
#   docker compose -f docker-compose.prod.example.yml up -d
services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: talkitout
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in your env file}
      POSTGRES_DB: talkitout
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U talkitout -d talkitout"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build: .
    image: talkitout-backend
    restart: unless-stopped
    env_file: backend.prod.env
    environment:
      NODE_ENV: production
      PORT: "3000"
      # Inside the compose network the database is reachable as "db".
      DATABASE_URL: postgres://talkitout:${POSTGRES_PASSWORD}@db:5432/talkitout
    depends_on:
      db:
        condition: service_healthy
    # Bound to the host loopback: expose it through your TLS proxy, not directly.
    ports:
      - "127.0.0.1:3000:3000"

volumes:
  pgdata:
